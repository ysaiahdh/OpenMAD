<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>OpenMAD — Telemetry HUD</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b22;
            --border: #282d37;
            --accent: #e03131;
            --green: #2f9e44;
            --text: #f1f3f5;
            --subtext: #868e96;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        h1 { font-size: 22px; font-weight: 700; color: var(--text); }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(47, 158, 68, 0.15); color: var(--green); }
        .status-badge.disconnected { background: rgba(224, 49, 49, 0.15); color: var(--accent); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--subtext); margin-bottom: 16px; }
        .telemetry-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .gauge-container { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .key-gauge { display: flex; align-items: center; gap: 12px; }
        .key-name { width: 48px; font-weight: 600; font-family: monospace; }
        .bar-bg { flex: 1; height: 12px; background: #252a34; border-radius: 6px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff922b, #e03131); transition: width 0.05s ease; }
        .val { width: 64px; text-align: right; font-family: monospace; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: #20242e; padding: 12px; border-radius: 6px; text-align: center; }
        .stat-box .num { font-size: 20px; font-weight: 700; color: #fff; }
        .stat-box .lbl { font-size: 11px; color: var(--subtext); margin-top: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>OpenMAD Telemetry HUD</h1>
            <p style="font-size: 12px; color: var(--subtext); margin-top: 4px;">Surveillance temps réel MAD68 HE</p>
        </div>
        <div id="conn-badge" class="status-badge disconnected">
            <span class="dot"></span>
            <span id="conn-text">Recherche du clavier...</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Touches Actives & Course (mm)</h2>
            <div id="gauges" class="gauge-container">
                <p style="color: var(--subtext); font-size: 14px;">Appuyez sur des touches pour visualiser la course en direct.</p>
            </div>
        </div>

        <div class="card">
            <h2>Statistiques du Pilote</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div id="hz-num" class="num">0</div>
                    <div class="lbl">Fréquence (Hz)</div>
                </div>
                <div class="stat-box">
                    <div id="ms-num" class="num">0.0</div>
                    <div class="lbl">Balayage (ms)</div>
                </div>
            </div>

            <h2 style="margin-top: 24px;">Profils Détectés</h2>
            <div id="profiles-list" style="font-size: 13px; color: var(--subtext);">
                Chargement...
            </div>
        </div>
    </div>

    <script>
        async function update() {
            try {
                const res = await fetch('/api/snapshot');
                if (!res.ok) return;
                const data = await res.json();

                const badge = document.getElementById('conn-badge');
                const connText = document.getElementById('conn-text');
                if (data.connected) {
                    badge.className = 'status-badge';
                    connText.innerText = 'Connecté (MAD68)';
                } else {
                    badge.className = 'status-badge disconnected';
                    connText.innerText = 'Clavier Déconnecté';
                }

                document.getElementById('hz-num').innerText = Math.round(data.sample_hz);
                document.getElementById('ms-num').innerText = data.sweep_ms.toFixed(1);

                const list = document.getElementById('profiles-list');
                if (data.profiles && data.profiles.length > 0) {
                    list.innerHTML = data.profiles.map(p => `<div>• <b>${p}</b></div>`).join('');
                } else {
                    list.innerText = 'Aucun profil JSON trouvé.';
                }

                const gauges = document.getElementById('gauges');
                const active = (data.keys || []).filter(k => k.travel_mm > 0.15);
                if (active.length === 0) {
                    gauges.innerHTML = '<p style="color: var(--subtext); font-size: 14px;">En attente de frappe sur le clavier...</p>';
                } else {
                    gauges.innerHTML = active.slice(0, 8).map(k => {
                        const pct = Math.min(100, Math.max(0, (k.travel_mm / 3.5) * 100));
                        return `
                            <div class="key-gauge">
                                <span class="key-name">${k.label}</span>
                                <div class="bar-bg">
                                    <div class="bar-fill" style="width: ${pct}%"></div>
                                </div>
                                <span class="val">${k.travel_mm.toFixed(2)} mm</span>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(update, 50);
        update();
    </script>
</body>
</html>
